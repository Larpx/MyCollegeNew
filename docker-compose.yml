# ============================================================
# Campus Attendance docker-compose 编排文件
# 三个服务：db（MySQL）、api（后端 API）、web（Blazor Server 前端）
# 启动顺序：db(healthy) → api(healthy) → web
# ============================================================

services:
  # ---- MySQL 数据库 ----
  db:
    image: mysql:8.0
    container_name: attendance-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---- 后端 API ----
  api:
    build:
      context: .
      dockerfile: src/Campus.Attendance.Api/Dockerfile
    container_name: attendance-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - Db__ProviderType=MySQL
      - Db__ConnectionString=Server=db;Port=3306;Database=attendance;Uid=root;Pwd=root;
      - Jwt__SecretKey=Campus.Attendance.SecretKey.2026.DoNotHardCode.InProduction
      - Jwt__Issuer=Campus.Attendance.Api
      - Jwt__Audience=Campus.Attendance.Client
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ---- Blazor Server 前端 ----
  web:
    build:
      context: .
      dockerfile: src/Campus.Attendance.Web/Dockerfile
    container_name: attendance-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      - Api__BaseUrl=http://api:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  mysql_data:
